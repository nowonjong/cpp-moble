    <text x="256" y="383" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','NanumGothic',sans-serif" font-size="210" font-weight="900" letter-spacing="-10" fill="#FFFFFF">끗</text>
  </g>

  <g filter="url(#crownShadow)">
    <path d="M113 145L142 213H376L405 145L343 185L297 80L254 165L208 80L162 185L113 145Z" fill="url(#gold)" stroke="url(#goldStroke)" stroke-width="11" stroke-linejoin="round"/>
    <path d="M143 214H375L365 250H153L143 214Z" fill="#F6AE25" stroke="#E58B10" stroke-width="9" stroke-linejoin="round"/>
    <path d="M165 219H353" fill="none" stroke="#FFF1A7" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
    <circle cx="111" cy="139" r="20" fill="#FF7185" stroke="#FFFFFF" stroke-width="8"/>
    <circle cx="208" cy="73" r="20" fill="#57E2BF" stroke="#FFFFFF" stroke-width="8"/>
    <circle cx="297" cy="73" r="20" fill="#6B49F6" stroke="#FFFFFF" stroke-width="8"/>
